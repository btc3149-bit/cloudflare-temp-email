name = "cloudflare_temp_email"
main = "src/worker.ts"
compatibility_date = "2025-04-01"
compatibility_flags = [ "nodejs_compat" ]
keep_vars = false

[vars]
PREFIX = "tmp"
FRONTEND_URL = "https://68626.us.ci"
BLACK_LIST = ""
ENABLE_USER_CREATE_EMAIL = true
ENABLE_USER_DELETE_EMAIL = true
ENABLE_AUTO_REPLY = false
DOMAINS = '["68626.us.ci"]'
DEFAULT_DOMAINS = '["68626.us.ci"]'

[[d1_databases]]
binding = "DB"
database_name = "temp-email-db"
database_id = "50c039da-4ded-4558-bbe5-6be37c9bcdfc"

[[kv_namespaces]]
binding = "KV"
id = "fac8352359e0406ab0c9f1413bcfb27a"
